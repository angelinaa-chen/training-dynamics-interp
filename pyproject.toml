[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tdi"
version = "0.1.0"
description = "Decodable vs. used: tracking the emergence and causal role of internal representations in small transformers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "scikit-learn",
    "tokenizers",
    "datasets",
    "spacy",
    "pyyaml",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
